name: Trivy image scan

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  trivy:
    name: Scan container image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Build image
        run: docker build -t ndc-prometheus:${{ github.sha }} .

      - name: Run Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ndc-prometheus:${{ github.sha }}
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
